<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCA HUB | Upload Notes</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#080b18;
color:white;
min-height:100vh;
}

.container{
max-width:650px;
margin:auto;
padding:30px 20px;
}

.header{
text-align:center;
padding:35px 10px;
}

.header h1{
font-size:38px;
margin-bottom:10px;
}

.gradient{
background:linear-gradient(90deg,#8b5cf6,#22d3ee,#ec4899);
-webkit-background-clip:text;
color:transparent;
}

.header p{
color:#aeb5cc;
line-height:1.6;
}

.form{
background:linear-gradient(145deg,#12172b,#171d34);
border:1px solid #292f4b;
border-radius:22px;
padding:28px;
}

label{
display:block;
margin-top:16px;
margin-bottom:7px;
font-weight:bold;
}

input,
select{
width:100%;
padding:14px;
border-radius:10px;
background:#080d1c;
border:1px solid #303750;
color:white;
font-size:15px;
outline:none;
}

input:focus,
select:focus{
border-color:#22d3ee;
}

.file{
padding:12px;
}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:11px;
background:linear-gradient(135deg,#8b5cf6,#6366f1);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#22d3ee;
text-decoration:none;
}

.status{
margin-top:20px;
padding:14px;
border-radius:10px;
background:#0b1021;
border:1px solid #252b45;
display:none;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>📚 BCA <span class="gradient">HUB</span></h1>

<p>
Upload your notes and PDFs directly from your phone.
</p>

</div>


<div class="form">

<label>📚 Semester</label>

<select id="semester">

<option value="">Select Semester</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>

</select>


<label>📖 Subject</label>

<input
id="subject"
type="text"
placeholder="Example: C Programming"
>


<label>📘 Unit</label>

<input
id="unit"
type="text"
placeholder="Example: Unit 1"
>


<label>✏️ Note Title</label>

<input
id="title"
type="text"
placeholder="Example: C Programming Complete Notes"
>


<label>📄 Select PDF</label>

<input
id="file"
class="file"
type="file"
accept="application/pdf"
>


<button onclick="uploadPDF()">

🚀 Upload Notes

</button>


<div id="status" class="status"></div>

</div>


<a href="index.html" class="back">
← Back to BCA HUB
</a>

</div>


<script>

function showStatus(message){

const status=document.getElementById("status");

status.innerText=message;

status.style.display="block";

}


async function uploadPDF(){

showStatus("⏳ Upload system will be connected next...");

}

</script>

</body>
</html>
